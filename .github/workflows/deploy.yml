name: Deploy to Cloudflare

# Runs the whole deploy from the browser — no terminal needed anywhere.
# Actions tab -> Deploy to Cloudflare -> Run workflow.
on:
  workflow_dispatch:
    inputs:
      skip_upload:
        description: 'Skip the R2 upload (only if the PDFs are already current)'
        type: boolean
        default: false
  # Uncomment once you are happy taking every merge to main straight to production.
  # push:
  #   branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Check the Cloudflare credentials are present
        # Failing here with a clear message beats failing four steps later with
        # a wrangler auth error that reads like a bug.
        run: |
          missing=
          [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ] && missing="$missing CLOUDFLARE_API_TOKEN"
          [ -z "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ] && missing="$missing CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing"
            echo "Add them under Settings -> Secrets and variables -> Actions." >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

      - run: npm ci

      - name: Ensure the R2 buckets exist
        # Idempotent: 'already exists' is the expected result on every run after
        # the first, so it must not fail the deploy.
        run: |
          for bucket in bba-network-downloads bba-network-downloads-preview; do
            if npx wrangler r2 bucket create "$bucket" 2>&1 | tee /tmp/r2.log; then
              echo "created $bucket"
            elif grep -qiE "already (exists|owned)|10004" /tmp/r2.log; then
              echo "$bucket already exists"
            else
              echo "::error::Could not create or confirm bucket $bucket"
              cat /tmp/r2.log
              exit 1
            fi
          done
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Resolve the site origin
        # wrangler.jsonc is authoritative. It is also what the Worker reads at
        # runtime, so letting a repo variable win here would inline one origin at
        # build time and serve another at request time — a split that shows up as
        # checkout redirects to the wrong host, not as a build error.
        #
        # Next inlines NEXT_PUBLIC_* at build time, so this has to be settled
        # before the build, not after.
        id: site
        run: |
          origin=$(node -e "
            const raw = require('fs').readFileSync('wrangler.jsonc', 'utf8')
              .replace(/\/\*[\s\S]*?\*\//g, '')
              .replace(/^\s*\/\/.*\$/gm, '');
            process.stdout.write(JSON.parse(raw).vars?.NEXT_PUBLIC_SITE_URL ?? '');
          ")
          origin="${origin%/}"

          declared="${{ vars.SITE_URL }}"
          declared="${declared%/}"
          if [ -n "$declared" ] && [ "$declared" != "$origin" ]; then
            echo "::warning::The SITE_URL repository variable says '$declared' but wrangler.jsonc says '$origin'. wrangler.jsonc wins; delete the variable to stop this warning."
          fi

          echo "origin=$origin" >> $GITHUB_OUTPUT
          echo "Site origin: ${origin:-<unset>}"

      - name: Build catalogue
        run: npm run catalog:build

      - name: Install Chromium for PDF generation
        run: npx playwright install --with-deps chromium

      - name: Build product PDFs
        run: npm run pdf:build

      - name: Verify page counts match the listings
        run: npm run pdf:check

      - name: Upload PDFs to R2
        # Must happen before the deploy: Workers has no filesystem, so without
        # this the Worker goes live pointing at files that are not there.
        if: ${{ !inputs.skip_upload }}
        run: npm run pdf:upload
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy the Worker
        id: deploy
        run: |
          set -o pipefail
          npm run cf:deploy 2>&1 | tee /tmp/deploy.log
          # Match only a line that is nothing but the URL. Wrangler prints the
          # bindings table first, and NEXT_PUBLIC_SITE_URL's value in it also
          # looks like a workers.dev address — grepping the whole log picks that
          # one up instead of the address actually deployed to.
          url=$(grep -oE '^[[:space:]]*https://[a-z0-9.-]+\.workers\.dev[[:space:]]*$' /tmp/deploy.log \
                | tr -d '[:space:]' | tail -1)
          echo "worker_url=$url" >> $GITHUB_OUTPUT
          echo "Deployed to: ${url:-<not detected>}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Next inlines NEXT_PUBLIC_* at BUILD time, so this has to be set here
          # rather than only in wrangler.jsonc vars.
          NEXT_PUBLIC_SITE_URL: ${{ steps.site.outputs.origin }}

      - name: Sync the Worker's own secrets from GitHub
        # The Cloudflare dashboard is the other way to set these, but its Variables
        # and Secrets panel is easy to lose on a tablet, and a value pasted there as
        # Text rather than Secret gets printed into this log by wrangler's config
        # diff. Holding them as GitHub repository secrets avoids both, and leaves one
        # place to look instead of two.
        #
        # Only names that are actually present are pushed, so this never blanks a
        # value already set on the Worker. A name that IS present overwrites the
        # Worker's copy — which is also what makes this the rotation path.
        run: |
          set -o pipefail
          synced=
          for name in STRIPE_SECRET_KEY STRIPE_WEBHOOK_SECRET DOWNLOAD_SIGNING_SECRET; do
            source="SECRET_$name"
            value="${!source}"
            [ -z "$value" ] && continue
            # printf, not echo: wrangler takes stdin verbatim, and a trailing
            # newline would become part of the signing secret.
            printf '%s' "$value" | npx wrangler secret put "$name"
            synced="$synced $name"
          done
          if [ -n "$synced" ]; then
            echo "Pushed to the Worker:$synced"
          else
            echo "No Worker secrets in GitHub — leaving whatever is already on the Worker."
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SECRET_STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          SECRET_STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          SECRET_DOWNLOAD_SIGNING_SECRET: ${{ secrets.DOWNLOAD_SIGNING_SECRET }}

      - name: Health check
        # The deploy is not done until the store can actually deliver a file.
        id: health
        run: |
          origin="${{ steps.site.outputs.origin }}"
          [ -z "$origin" ] && origin="${{ steps.deploy.outputs.worker_url }}"

          if [ -z "$origin" ]; then
            echo "::warning::Could not determine the deployed URL; skipping the health check."
            echo "skipped=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "checking $origin/api/health"
          for attempt in 1 2 3 4 5; do
            body=$(curl -sS --max-time 20 "$origin/api/health" || true)
            if echo "$body" | grep -q '"ok":true'; then
              echo "healthy"
              echo "body=$body" >> $GITHUB_OUTPUT
              exit 0
            fi
            sleep $((attempt * 5))
          done

          echo "body=$body" >> $GITHUB_OUTPUT
          echo "unhealthy=true" >> $GITHUB_OUTPUT
          echo "::error::Deployed but unhealthy. See the job summary for what is missing."
          exit 1

      - name: Write the summary
        # Runs even on failure so the summary explains what to fix. Reading this
        # is far easier than scrolling raw logs, especially on a phone or tablet.
        if: always()
        run: |
          url="${{ steps.site.outputs.origin }}"
          [ -z "$url" ] && url="${{ steps.deploy.outputs.worker_url }}"

          {
            echo "## Deploy result"
            echo
            if [ -n "$url" ]; then
              echo "**Your store:** $url"
              echo
              echo "**Health:** $url/api/health"
              echo
            fi

            if [ "${{ steps.health.outputs.unhealthy }}" = "true" ]; then
              echo "### Not healthy yet"
              echo
              echo '```json'
              echo '${{ steps.health.outputs.body }}'
              echo '```'
              echo
              echo "- \`\"missing\"\` is not empty -> the PDFs are not in R2. Re-run this workflow with **Skip the R2 upload** unticked."
              echo "- A \`config\` value is \`false\` -> that secret is not set on the Worker."
              echo "  Add it under GitHub -> Settings -> Secrets and variables -> Actions as a repository"
              echo "  secret of the same name (\`STRIPE_SECRET_KEY\`, \`STRIPE_WEBHOOK_SECRET\`,"
              echo "  \`DOWNLOAD_SIGNING_SECRET\`), then run this workflow again — it pushes them to the Worker."
              echo "- \`\"backend\": \"filesystem\"\` -> the R2 binding is not attached."
              echo "- \`stripe.reachable: false\` -> the Stripe key is missing or does not authenticate."
              echo "- \`stripe.pricesResolved: 0\` -> the key works but belongs to an account with none"
              echo "  of the catalogue's products on it. Check you are not using a sandbox key."
            elif [ "${{ steps.health.outputs.skipped }}" = "true" ]; then
              echo "Health check skipped — no URL available."
            elif [ "${{ job.status }}" = "success" ]; then
              echo "### Healthy"
              echo
              echo "The store is live and can deliver files."
              echo
            fi
          } >> $GITHUB_STEP_SUMMARY
