name: Deploy to Cloudflare

# Manual by default. Flip the `push` trigger on once you are happy taking every
# merge to main straight to production.
on:
  workflow_dispatch:
    inputs:
      skip_upload:
        description: 'Skip the R2 upload (only if the PDFs are already current)'
        type: boolean
        default: false
  # push:
  #   branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build catalogue
        run: npm run catalog:build

      - name: Install Chromium for PDF generation
        run: npx playwright install --with-deps chromium

      - name: Build product PDFs
        run: npm run pdf:build

      - name: Verify page counts match the listings
        run: npm run pdf:check

      - name: Upload PDFs to R2
        # Must happen before the deploy: Workers has no filesystem, so without
        # this the Worker goes live pointing at files that are not there.
        if: ${{ !inputs.skip_upload }}
        run: npm run pdf:upload
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy the Worker
        run: npm run cf:deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.SITE_URL }}

      - name: Health check
        # The deploy is not done until the store can actually deliver a file.
        run: |
          url="${{ vars.SITE_URL }}/api/health"
          echo "checking $url"
          for attempt in 1 2 3 4 5; do
            body=$(curl -sS --max-time 20 "$url" || true)
            if echo "$body" | grep -q '"ok":true'; then
              echo "healthy: $body"
              exit 0
            fi
            echo "attempt $attempt not healthy yet"
            sleep $((attempt * 5))
          done
          echo "::error::Deploy is live but unhealthy. Last response: $body"
          echo "::error::Most likely the PDFs are not in R2 — run 'npm run pdf:upload'."
          exit 1
