name: Agent · Checkout end-to-end

# Proves a customer can pay and receive the file.
#
# The unit suite checks each of the four download gates against fabricated
# Stripe objects. This checks the thing they cannot: that a real payment on a
# real Stripe account, through the real hosted Checkout page, ends with the
# buyer holding the PDF — and stops working the moment it is refunded.
#
# It runs the store on localhost inside the runner, so the deployed Worker is
# never touched. It needs a runner rather than a Cloudflare session because the
# hosted Checkout page has to be driven in a browser.
#
# TEST MODE ONLY. scripts/e2e-checkout.mjs aborts before its first network call
# unless the key it is given is recognisably a test key, because it creates a
# real charge and a real refund.
#
# It prefers STRIPE_TEST_SECRET_KEY and falls back to STRIPE_SECRET_KEY. Once
# the store goes live the latter holds an sk_live_ key and the script will
# refuse it, so set the former before then — see docs/GO-LIVE.md.

on:
  workflow_dispatch:
    inputs:
      sku:
        description: 'Which product to buy'
        required: false
        default: 'espresso-dial-in-card'
      keep_paid:
        description: 'Skip the refund step and leave the test order paid'
        type: boolean
        default: false
  schedule:
    # Weekly, so a break in the paid path is found by us rather than by a buyer.
    - cron: '25 6 * * 1'

concurrency:
  group: checkout-e2e
  cancel-in-progress: false

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Check a test-mode Stripe key is present
        # Failing here with a readable message beats failing inside Playwright.
        # Neither value is ever echoed; only whether one exists.
        #
        # STRIPE_TEST_SECRET_KEY first, STRIPE_SECRET_KEY second. That order is
        # what keeps this workflow working after the store goes live: from that
        # point STRIPE_SECRET_KEY holds an sk_live_ key, and the script refuses
        # to run against it — correctly, since this buys something and then
        # refunds it. Without a dedicated test key, going live silently retires
        # the only test that proves buyers can still receive what they paid for.
        run: |
          if [ -z "${{ secrets.STRIPE_TEST_SECRET_KEY }}" ] && [ -z "${{ secrets.STRIPE_SECRET_KEY }}" ]; then
            echo "::error::Neither STRIPE_TEST_SECRET_KEY nor STRIPE_SECRET_KEY is set. Add a test-mode key under Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      - run: npm ci

      - name: Build the catalogue and the PDFs
        # The download route streams a real file, so the files have to exist.
        # Locally that is the filesystem backend, not R2.
        run: |
          npm run catalog:build
          npx playwright install --with-deps chromium
          npm run pdf:build

      - name: Build the store
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000

      # A signing secret that exists only for this run.
      #
      # lib/download-token.ts throws unless DOWNLOAD_SIGNING_SECRET is at least
      # 32 characters, so the success page cannot mint a link without one — the
      # first run of this workflow got as far as starting the store and would
      # have died there.
      #
      # It deliberately does NOT reuse the production value. Every token minted
      # here is verified by the same process seconds later, so the two only have
      # to agree with each other; and a throwaway secret means this workflow
      # needs no secret it could leak, and cannot mint a link that works against
      # the deployed store.
      - name: Mint a signing secret for this run
        id: signing
        run: echo "secret=$(openssl rand -base64 48 | tr -d '\n')" >> "$GITHUB_OUTPUT"

      - name: Start the store
        run: |
          npx next start -p 3000 -H 127.0.0.1 > /tmp/store.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -sf http://127.0.0.1:3000/ > /dev/null; then
              echo "store is up"
              exit 0
            fi
            sleep 2
          done
          echo "::error::the store did not start"
          cat /tmp/store.log
          exit 1
        env:
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_TEST_SECRET_KEY || secrets.STRIPE_SECRET_KEY }}
          DOWNLOAD_SIGNING_SECRET: ${{ steps.signing.outputs.secret }}

      - name: Buy something
        run: |
          node scripts/e2e-checkout.mjs \
            --origin http://127.0.0.1:3000 \
            --sku "${{ inputs.sku || 'espresso-dial-in-card' }}" \
            ${{ inputs.keep_paid && '--keep-paid' || '' }}
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_TEST_SECRET_KEY || secrets.STRIPE_SECRET_KEY }}

      - name: Store log on failure
        if: failure()
        run: tail -100 /tmp/store.log
