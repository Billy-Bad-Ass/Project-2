name: Agent · Market intelligence

# Fans out one research agent per product niche, adversarially checks every
# finding, and opens a PR with the ranked action list.
on:
  schedule:
    - cron: "0 7 * * 1" # Mondays 07:00 UTC
  workflow_dispatch:
    inputs:
      niches:
        description: 'Optional JSON array of niches to scan instead of the default set'
        required: false
        default: ''

concurrency:
  group: agent-market-intel
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - id: start
        run: echo "started=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Tell the dashboard a run started
        # A reporting problem must not fail the agent run, and must not look
        # like it worked either. See .github/actions/report-run.
        uses: ./.github/actions/report-run
        with:
          agent: market-researcher
          project_slug: project-2
          trigger: ${{ github.event_name == 'schedule' && 'cron' || 'manual' }}
          status: running
          started_at: ${{ steps.start.outputs.started }}
          summary: Weekly market scan started.
          artifact_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          dashboard_url: ${{ secrets.DASHBOARD_URL }}
          dashboard_token: ${{ secrets.DASHBOARD_TOKEN }}
          access_client_id: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          access_client_secret: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}

      - name: Is a Claude credential configured?
        id: investigator
        uses: ./.github/actions/investigator
        with:
          oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          api_key: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Run the market-intel workflow
        id: scan
        if: steps.investigator.outputs.ready == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          # Prefer the Claude subscription token when it is set: on a Max plan
          # these runs cost nothing, where an API key bills per token. The
          # action gives the API key precedence when BOTH are present, so the
          # key is deliberately blanked when a subscription token exists.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN == '' && secrets.ANTHROPIC_API_KEY || '' }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            /market-intel ${{ inputs.niches }}

            When the workflow finishes, commit the generated report under
            docs/research/ to a new branch named
            agent/market-intel-${{ github.run_number }} and open a pull request
            titled "Market intelligence — week of <the report's date>".

            The PR body should be the report's summary and its ranked action list.
            Do not change prices, listings or product content in this PR — it is a
            research report only.
          claude_args: |
            --allowed-tools Read,Write,Edit,Bash,Grep,Glob,WebSearch,WebFetch,Workflow,Agent
        env:
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}

      - name: Say why nothing was produced
        if: always() && steps.investigator.outputs.ready != 'true'
        run: |
          echo "::warning title=No market scan produced::Neither CLAUDE_CODE_OAUTH_TOKEN nor ANTHROPIC_API_KEY is set in this repository, so the agent step was skipped. No competitor pricing, demand signal or keyword gap was collected this week. Run 'claude setup-token' and store the result as CLAUDE_CODE_OAUTH_TOKEN under Settings -> Secrets and variables -> Actions."

      - name: Report the outcome
        if: always()
        uses: ./.github/actions/report-run
        with:
          agent: market-researcher
          project_slug: project-2
          trigger: ${{ github.event_name == 'schedule' && 'cron' || 'manual' }}
          started_at: ${{ steps.start.outputs.started }}
          status: >-
            ${{ steps.scan.outcome == 'failure' && 'failed'
            || job.status == 'failure' && 'failed'
            || steps.investigator.outputs.ready != 'true' && 'skipped'
            || 'ok' }}
          summary: >-
            ${{ steps.investigator.outputs.ready == 'true'
            && 'Weekly market scan.'
            || 'Skipped: no Claude credential is configured in this repository.' }}
          artifact_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          dashboard_url: ${{ secrets.DASHBOARD_URL }}
          dashboard_token: ${{ secrets.DASHBOARD_TOKEN }}
          access_client_id: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          access_client_secret: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
